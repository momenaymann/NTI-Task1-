<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Formt</title>
</head>
<body>

    <h1 align="center">Doctor Appointment Form</h1>

    <hr color="red">

    <br>

    <form>

        <label>Appointment Date</label>
        <input type="date">

        <br><br><br>

        <label>Appointment Time</label>
        <input type="time">

        <br><br><br>

        <label>Name</label>
        <input type="text" placeholder="First">
        <input type="text" placeholder="Last">

        <br><br><br>

        <label>Gender</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender" checked> Female

        <br><br><br>

        <label>Phone</label>
        <input type="tel">

        <br><br><br>

        <label>Address</label>
        <input type="text" placeholder="City">
        <input type="text" placeholder="State">

        <br><br><br>

        <label>Your Query</label>
        <br>
        <textarea rows="6" cols="55"></textarea>

        <br><br>

        <label>Appointment Type</label>

        <br>

        Select which appointment type(s) you require

        <br>

        <input type="checkbox" checked>
        Cervix checkup

        <br>

        <input type="checkbox" checked>
        Heart checkup

        <br>

        <input type="checkbox">
        Eye check-up

        <br>

        <input type="checkbox">
        Hearing Test

        <br><br>

        <input type="submit" value="Send">

    </form>

</body>
</html>
